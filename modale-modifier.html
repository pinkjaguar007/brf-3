<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tachkila</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>

<body>


    <main>

        <div class=" flex items-center justify-center min-h-screen border     ">

            <form class=" w-full max-w-[560px] p-8 space-y-6 rounded-2xl bg-slate-700 border border-slate-700 ">

                <h1 item-center class=" text-white text-xl font-bold ">Ajoute un joueur</h1>

                <div>
                    <label class="block text-white  font-bold mb-2" for="nom complete">
                        Nom complete
                    </label>
                    <input placeholder="Ex. Ayoub Mansouri   " type="text" id="nom complete" name="name" required
                        class=" w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-white">
                </div>

                <p class=" font-bold text-white">Post</p>

                <div class="add-position  grid  grid-cols-2  grid-rows-2 gap-4 text-white  ">



                    <button
                        class="bg-slate-900 border-1 rounded-2xl border-slate-700 flex items-center gap-4 px-4 py-2.5">
                        <span class="size-2.5 rounded-full bg-amber-400"></span>
                        gardian</button>
                    <button
                        class="bg-slate-900 border-1 rounded-2xl border-slate-700 flex items-center gap-4 px-4 py-2.5 ">
                        <span class="size-2.5 rounded-full bg-blue-500"></span>
                        defenseur</button>
                    <button
                        class="bg-slate-900 border-1 rounded-2xl border-slate-700  flex items-center gap-4  px-4 py-2.5">
                        <span class="size-2.5 rounded-full bg-green-500"></span>
                        miliue</button>
                    <button
                        class="bg-slate-900 border-1 rounded-2xl border-slate-700  flex items-center gap-4  px-4 py-2.5">
                        <span class="size-2.5 rounded-full bg-red-500"></span>
                        attaquant</button>


                </div>

                <div>
                    <label class="block text-white  font-bold mb-2" for="palyer-number" class=" ">Numero (1 a 99)
                    </label>
                    <input placeholder="Ex. 7" type="text" id="palyer-number" palyer-number="name" required
                        class=" w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-white ">

                </div>

                <div class="flex justify-end gap-2  ">

                    <button class="bg-slate-400  text-white font-bold rounded-xl border-slate-400 px-6 py-2.5">
                        Annuler
                    </button>

                    <button class="bg-green-500 text-white font-bold border-1 rounded-xl border-green-500  px-6 py-2.5">
                        enregistrer
                    </button>



                </div>

            </form>



        </div>


    </main>

</body>

</html>
